<html>
<head>
  <title>Моделирование по закону Гука</title>
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
  <style>
    body {
      background: silver;
      margin: 0;
      padding: 10px;
    }
    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .left-panel {
      display: flex;
      flex-direction: column;
    }
    #map {
      width: 500px;
      height: 800px;
      border: 10px groove silver;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left-panel">
      <canvas id="polotno" style="border: 10px groove silver;"
              width="800" height="800"></canvas>
      <br><br>
      <button id="button" onclick="startStop()">START</button>
      <input type="range" min="0" max="780" value="400"
             oninput="x = +value; v = 0; refresh()"
             style="width: 600px;">
    </div>

    <div id="map"></div>
  </div>

  <script>
    const canvas = document.getElementById('polotno');
    const button = document.getElementById('button');
    const ctx = canvas.getContext('2d');

    const X = 400;
    const Y = 400;

    const m = 1;       // масса
    const k = 10;      // жёсткость пружины
    const dt = 0.02;   // шаг времени в секундах

    let x = X;
    let v = 0;         // скорость груза
    let timer = null;

    function refresh() {
      canvas.width += 0;
      ctx.fillStyle = 'black';
      ctx.fillRect(x, Y, 20, 20);
    }

    function nextStep() {
      const force = -k * (x - X);
      const acceleration = force / m;

      v += acceleration * dt;
      x += v * dt;

      refresh();
    }

    function startStop() {
      if (timer === null) {
        v = 0;
        timer = setInterval(nextStep, dt * 1000);
        button.textContent = 'STOP';
      } else {
        clearInterval(timer);
        timer = null;
        button.textContent = 'START';
      }
    }

    refresh();

    // Инициализация Яндекс.Карты с центром на Пущино
    ymaps.ready(init);

    function init() {
      const map = new ymaps.Map("map", {
        center: [54.8333, 37.6167], // Пущино
        zoom: 13,
        controls: ['zoomControl', 'fullscreenControl', 'typeSelector']
      });

      const placemark = new ymaps.Placemark([54.8333, 37.6167], {
        hintContent: 'Пущино',
        balloonContent: 'Пущино — город в Московской области'
      }, {
        preset: 'islands#redIcon'
      });

      map.geoObjects.add(placemark);
    }
  </script>

</body>
</html>
